[package]
name = "ryza-native-tts"
version = "0.1.0"
edition = "2021"
description = "Embedded Style-Bert-VITS2 host for Ryza Chat"
publish = false

[lib]
name = "ryza_tts"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ryza-tts"
path = "src/main.rs"
required-features = ["sidecar"]

[features]
default = ["sidecar"]
sidecar = []
android-jni = ["dep:jni"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sbv2_core = { path = "vendor/sbv2_core", default-features = false, features = ["std"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }

[patch.crates-io]
esaxx-rs = { path = "patches/esaxx-rs" }

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = true
